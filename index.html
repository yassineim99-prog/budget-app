<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Budget</title>
<style>
:root{
  --bg:#f4f6f5; --card:#ffffff; --text:#14201d; --muted:#61716c; --line:#e1e7e5;
  --accent:#0f766e; --accent-soft:#d6efec; --neg:#c2410c; --pos:#15803d;
  --fixed:#0f766e; --var:#d97706; --save:#6d28d9; --left:#a3b5b0;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 10px rgba(0,0,0,.04); --r:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1312; --card:#161f1d; --text:#e7efed; --muted:#93a59f; --line:#26332f;
  --accent:#2dd4bf; --accent-soft:#123a35; --neg:#fb923c; --pos:#4ade80;
  --fixed:#2dd4bf; --var:#fbbf24; --save:#a78bfa; --left:#3b4c47; --shadow:none;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;display:flex;align-items:center;gap:8px;max-width:760px;margin:0 auto}
header .month{flex:1;text-align:center;font-weight:650;font-size:17px}
header .month small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.iconbtn{border:0;background:var(--card);box-shadow:var(--shadow);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:18px;display:grid;place-items:center;border:1px solid var(--line)}
main{max-width:760px;margin:0 auto;padding:4px 16px calc(150px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center}
.muted{color:var(--muted)} .small{font-size:12.5px}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.neg{color:var(--neg)} .pos{color:var(--pos)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:600px){.grid.g4{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.tile .lbl{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tile .val{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line);margin:14px 0 8px;gap:2px}
.stack>div{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar>div{height:100%;background:var(--accent);border-radius:99px}
.bar.over>div{background:var(--neg)}
.catrow{padding:8px 0;border-top:1px solid var(--line)} .catrow:first-of-type{border-top:0}
.catrow .top{display:flex;justify-content:space-between;gap:8px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
ul.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer;border-radius:8px}
.row:first-child{border-top:0}
.row:hover{background:var(--accent-soft)}
.ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:700;flex:none;background:var(--accent-soft);color:var(--accent);font-size:14px}
.row .main{flex:1;min-width:0}
.row .title{font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-top:2px}
.row .amt{text-align:right;font-weight:600}
.row .amt .sub{justify-content:flex-end;font-weight:400}
.badge{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--line);color:var(--muted);white-space:nowrap}
.badge.fixed{background:color-mix(in srgb,var(--fixed) 18%,transparent);color:var(--fixed)}
.badge.var{background:color-mix(in srgb,var(--var) 20%,transparent);color:var(--var)}
.badge.joint{background:color-mix(in srgb,var(--save) 18%,transparent);color:var(--save)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;cursor:pointer;white-space:nowrap;font-size:13.5px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
@media (prefers-color-scheme:dark){.chip.on{color:#05201d}}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;padding:7px;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow);font-weight:600}
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin:16px 4px 6px;font-weight:650}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:760px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:8px 2px 9px;cursor:pointer;color:var(--muted);font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .i{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--accent);font-weight:600}
.fab{position:fixed;right:max(16px,calc(50vw - 364px));bottom:calc(72px + env(safe-area-inset-bottom));z-index:6;border:0;border-radius:99px;background:var(--accent);color:#fff;padding:13px 20px;font-weight:650;box-shadow:0 6px 18px rgba(0,0,0,.2);cursor:pointer}
@media (prefers-color-scheme:dark){.fab{color:#05201d}}
dialog{border:0;border-radius:18px;padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 40px);background:var(--card);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:18px}
dialog h2{margin:0 0 14px;font-size:18px}
label.f{display:block;margin-bottom:12px;font-size:13px;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px;color:var(--text)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;margin:4px 0 12px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.splitbox{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.splitrow{display:flex;align-items:center;gap:10px;padding:4px 0}
.splitrow label{flex:1;display:flex;gap:10px;align-items:center;cursor:pointer}
.splitrow input[type=number]{width:70px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.splitrow .pv{width:80px;text-align:right;font-size:12.5px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:8px}
.btn{border:1px solid var(--line);background:var(--card);padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:550}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
@media (prefers-color-scheme:dark){.btn.primary{color:#05201d}}
.btn.danger{color:var(--neg)}
.btn.sm{padding:6px 11px;font-size:13px}
.spacer{flex:1}
.months{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:6px}
.months .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;cursor:pointer}
.months .bars{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.months .bars div{width:40%;max-width:16px;border-radius:4px 4px 0 0;min-height:2px}
.months .m.cur span{color:var(--text);font-weight:650}
.months span{font-size:11.5px;color:var(--muted)}
.goal{padding:10px 0;border-top:1px solid var(--line)} .goal:first-of-type{border-top:0}
.goal .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.goal .bar{height:10px}
.goal .bar>div{background:var(--save)}
.person{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.person:first-of-type{border-top:0}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{text-align:right;padding:6px 4px;border-top:1px solid var(--line)}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--muted);font-weight:500;border-top:0;white-space:nowrap}
table.t td{vertical-align:top}
table.t tr[data-act]:hover td{background:var(--accent-soft)}
.catedit{display:flex;gap:8px;align-items:center;padding:6px 0}
.catedit input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0}
.catedit input.n{flex:1} .catedit input.l{width:100px}
a{color:var(--accent)}
.row .main .title::after{content:" ✎";opacity:.35;font-size:12px}
.syncdot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
</style>
</head>
<body>
<header>
  <button class="iconbtn" data-act="prev-month" aria-label="Previous month">‹</button>
  <div class="month" id="monthLabel"></div>
  <button class="iconbtn" data-act="next-month" aria-label="Next month">›</button>
</header>
<main id="view"></main>
<button class="fab" id="fab" data-act="fab"></button>
<nav class="tabs"><div class="in">
  <button data-tab="overview"><span class="i">▤</span>Overview</button>
  <button data-tab="spending"><span class="i">⇣</span>Spending</button>
  <button data-tab="income"><span class="i">⇡</span>Income</button>
  <button data-tab="goals"><span class="i">◎</span>Goals</button>
  <button data-tab="people"><span class="i">☺</span>People</button>
  <button data-tab="settings"><span class="i">⚙</span>Settings</button>
</div></nav>
<dialog id="modal"><form id="mform" novalidate><h2 id="mtitle"></h2><div id="mbody"></div><div class="actions" id="mactions"></div></form></dialog>

<script>
"use strict";
/* ---------- helpers ---------- */
const KEY = 'budget-app-v1';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const curMonth = () => todayISO().slice(0, 7);
const addMonths = (ym, n) => { let [y, m] = ym.split('-').map(Number); m += n; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return `${y}-${pad(m)}`; };
const monthDiff = (a, b) => { const [ay, am] = a.split('-').map(Number), [by, bm] = b.split('-').map(Number); return (by - ay) * 12 + (bm - am); };
const daysIn = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? Math.round(n * 100) / 100 : 0; };
const COLORS = ['#0f766e','#d97706','#6d28d9','#db2777','#2563eb','#65a30d','#dc2626','#0891b2'];

const DEFAULT_CATS = ['Housing','Utilities','Groceries','Transport','Eating out','Subscriptions','Health','Shopping','Entertainment','Travel','Gifts','Savings','Other'];
function defaultState() {
  return { version: 1, updatedAt: 0,
    settings: { currency: 'EUR', locale: navigator.language || 'en-US' },
    people: [{ id: 'me', name: 'Me', color: COLORS[0] }],
    categories: DEFAULT_CATS.map(name => ({ name, limit: 0 })),
    entries: [], recurring: [], goals: [], settlements: [] };
}
function migrate(d) {
  const s = Object.assign(defaultState(), d || {});
  s.settings = Object.assign(defaultState().settings, s.settings || {});
  for (const k of ['people','categories','entries','recurring','goals','settlements']) if (!Array.isArray(s[k])) s[k] = [];
  if (!s.deleted || typeof s.deleted !== 'object') s.deleted = {};
  if (!s.people.find(p => p.id === 'me')) s.people.unshift({ id: 'me', name: 'Me', color: COLORS[0] });
  if (!s.categories.length) s.categories = DEFAULT_CATS.map(name => ({ name, limit: 0 }));
  if (!s.categories.some(c => c.name === 'Savings')) s.categories.splice(Math.max(0, s.categories.length - 1), 0, { name: 'Savings', limit: 0 });
  return s;
}
function loadLocal() { try { return migrate(JSON.parse(localStorage.getItem(KEY))); } catch { return defaultState(); } }

let S = loadLocal();
const ui = { tab: 'overview', month: curMonth(), filter: 'all', view: 'me' };
try { Object.assign(ui, JSON.parse(sessionStorage.getItem('budget-ui') || '{}')); } catch {}

function money(n, opts = {}) {
  try { return new Intl.NumberFormat(S.settings.locale || undefined, { style: 'currency', currency: S.settings.currency || 'EUR', ...opts }).format(n || 0); }
  catch { return (n || 0).toFixed(2) + ' ' + S.settings.currency; }
}
const monthLabel = (ym, short) => new Date(ym + '-01T12:00').toLocaleDateString(S.settings.locale || undefined, short ? { month: 'short' } : { month: 'long', year: 'numeric' });
const dateLabel = iso => new Date(iso + 'T12:00').toLocaleDateString(S.settings.locale || undefined, { day: 'numeric', month: 'short' });
const person = id => S.people.find(p => p.id === id) || { id, name: '(removed)', color: '#888' };
const pname = id => id === ME ? 'You' : person(id).name;

/* ---------- persistence + sync (home server or free Google cloud) ---------- */
// Every record gets a change time "u"; deletions leave a tombstone in S.deleted.
// Two phones that changed different things are merged, nothing is overwritten.
const COLLS = ['people', 'entries', 'recurring', 'goals', 'settlements'];
const lsGet = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };
let ME = lsGet('budget-me', 'me'); // which person uses THIS device
const sync = { status: 'local', timer: null, busy: false, again: false, last: 0,
  pin: lsGet('budget-pin', ''), cfg: (() => { try { return JSON.parse(lsGet('budget-sync', 'null')); } catch { return null; } })() };

function recKeys(st) {
  const m = new Map();
  for (const c of COLLS) for (const r of st[c] || []) {
    const { u, contributions, ...rest } = r; m.set(c + ':' + r.id, JSON.stringify(rest));
    if (c === 'goals') for (const x of contributions || []) { const { u: _u, ...cr } = x; m.set('contrib:' + x.id, JSON.stringify(cr)); }
  }
  m.set('meta', JSON.stringify({ s: st.settings, c: st.categories }));
  return m;
}
let snap = recKeys(S);
function stamp() {
  const now = Date.now(), cur = recKeys(S);
  S.deleted ||= {};
  for (const c of COLLS) for (const r of S[c]) {
    if (snap.get(c + ':' + r.id) !== cur.get(c + ':' + r.id)) r.u = now;
    if (c === 'goals') for (const x of r.contributions || []) if (snap.get('contrib:' + x.id) !== cur.get('contrib:' + x.id)) x.u = now;
  }
  if (snap.get('meta') !== cur.get('meta')) S.metaU = now;
  for (const k of snap.keys()) if (k !== 'meta' && !cur.has(k)) S.deleted[k.slice(k.indexOf(':') + 1)] = now;
  snap = cur;
}
function mergeList(a, b, del) {
  const map = new Map();
  for (const r of a) map.set(r.id, r);
  for (const r of b) { const cur = map.get(r.id); if (!cur || (r.u || 0) > (cur.u || 0)) map.set(r.id, r); }
  return [...map.values()].filter(r => !(del[r.id] && del[r.id] >= (r.u || 0)));
}
function mergeStates(a, b) { // a = this device, b = cloud copy
  const out = JSON.parse(JSON.stringify(a)), del = { ...(b.deleted || {}) };
  for (const k in a.deleted || {}) del[k] = Math.max(del[k] || 0, a.deleted[k]);
  out.deleted = del;
  for (const c of COLLS) {
    out[c] = mergeList(a[c] || [], b[c] || [], del).map(r => JSON.parse(JSON.stringify(r)));
    if (c === 'goals') for (const g of out.goals) {
      const ga = (a.goals || []).find(x => x.id === g.id), gb = (b.goals || []).find(x => x.id === g.id);
      g.contributions = mergeList(ga ? ga.contributions || [] : [], gb ? gb.contributions || [] : [], del);
    }
  }
  if ((b.metaU || 0) > (a.metaU || 0)) { out.settings = b.settings; out.categories = b.categories; out.metaU = b.metaU; }
  out.updatedAt = Math.max(a.updatedAt || 0, b.updatedAt || 0);
  return migrate(out);
}
function fingerprint(st) {
  const sortById = l => [...(l || [])].sort((x, y) => x.id < y.id ? -1 : 1);
  return JSON.stringify([st.settings, st.categories, ...COLLS.map(c => sortById(st[c]).map(r => c === 'goals' ? { ...r, contributions: sortById(r.contributions) } : r)), Object.keys(st.deleted || {}).sort()]);
}
function saveLocal() { lsSet(KEY, JSON.stringify(S)); }
function save() {
  stamp(); S.updatedAt = Date.now(); saveLocal();
  if (backend()) { clearTimeout(sync.timer); sync.timer = setTimeout(() => { sync.timer = null; syncNow(); }, 600); }
  render();
}
const hdr = () => sync.pin ? { 'X-Budget-Pin': sync.pin } : {};
const serverBackend = {
  async get() {
    const r = await fetch('api/data', { headers: hdr(), cache: 'no-store' });
    if (r.status === 401) throw { auth: true };
    if (!r.ok) throw { absent: true };
    const j = await r.json().catch(() => null);
    if (!j || !('rev' in j)) throw { absent: true };
    return j;
  },
  async put(rev, data) {
    const r = await fetch('api/data', { method: 'PUT', headers: { 'Content-Type': 'application/json', ...hdr() }, body: JSON.stringify({ rev, data }) });
    if (r.status === 401) throw { auth: true };
    const j = await r.json();
    if (r.status === 409) return { conflict: true, ...j };
    if (!r.ok) throw {};
    return j;
  }
};
const cloudBackend = cfg => ({
  async get() {
    const r = await fetch(cfg.url + (cfg.url.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(cfg.key), { cache: 'no-store' });
    const j = await r.json();
    if (j.error === 'auth') throw { auth: true, cloud: true };
    if (j.error) throw {};
    return j;
  },
  async put(rev, data) {
    const r = await fetch(cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ key: cfg.key, rev, data }) });
    const j = await r.json();
    if (j.error === 'auth') throw { auth: true, cloud: true };
    if (j.error && !j.conflict) throw {};
    return j;
  }
});
let serverAbsent = false;
function backend() {
  if (sync.cfg && sync.cfg.url) return cloudBackend(sync.cfg);
  if (location.protocol !== 'file:' && !serverAbsent) return serverBackend;
  return null;
}
function setStatus(s) { if (sync.status === s) return; sync.status = s; renderHeader(); if (ui.tab === 'settings' && !$('#modal').open) render(); }
async function syncNow() {
  const be = backend(); if (!be) return setStatus('local');
  if (sync.busy) { sync.again = true; return; }
  sync.busy = true; setStatus(sync.status === 'local' ? 'local' : sync.status);
  try {
    for (let attempt = 0; attempt < 5; attempt++) {
      const remote = await be.get();
      const rd = remote.data && Array.isArray(remote.data.entries) ? migrate(remote.data) : null;
      if (rd) {
        const merged = mergeStates(S, rd);
        if (fingerprint(merged) !== fingerprint(S)) { S = merged; snap = recKeys(S); saveLocal(); if (!$('#modal').open) render(); }
        if (fingerprint(S) === fingerprint(rd)) break; // cloud already has everything
      } else if (!S.updatedAt) break; // both empty
      const res = await be.put(remote.rev || 0, S);
      if (!res.conflict) break; // otherwise someone saved in between: fetch again and merge
    }
    sync.last = Date.now(); setStatus('synced');
  } catch (e) {
    if (e && e.auth && !e.cloud) {
      const p = prompt('This budget is protected. Enter PIN:');
      if (p) { sync.pin = p; lsSet('budget-pin', p); sync.busy = false; return syncNow(); }
      setStatus('locked');

      const warn = $('#splitWarn');
      warn.hidden = !(joint && ['income', 'equalLeft'].includes(mode) && noInc.length);
      warn.textContent = `No income entered for ${noInc.map(pname).join(', ')} in ${monthLabel(ym)} — add it in the Income tab (choose “Whose income?”) for this split to be fair.`;
    };
    $('#modeSeg').onclick = ev => { const m = ev.target.dataset.m; if (!m) return; form.splitMode.value = m; $('#modeSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.m === m)); upd(); };
    form.joint.onchange = () => { $('#splitBox').hidden = !form.joint.checked; upd(); };
    form.oninput = upd; form.onchange = ev => { if (ev.target !== form.category && ev.target !== form.goalId) upd(); }; upd();
  }
}

function incomeForm(item) {
  const rec = item && item.src === 'recurring' ? S.recurring.find(r => r.id === item.id) : null;
  const ent = item && item.src === 'entry' ? S.entries.find(x => x.id === item.id) : null;
  const e = rec || ent || { name: '', amount: '', person: ME };
  const body = `${field('Source', `<input name="name" required value="${esc(e.name)}" placeholder="e.g. Salary, Freelance" autocomplete="off">`)}
    <div class="two">${field('Amount', `<input name="amount" required type="number" inputmode="decimal" step="0.01" min="0" value="${e.amount}" placeholder="0.00">`)}
    ${field('Date', `<input name="date" type="date" required value="${item ? item.date : defaultDate()}">`)}</div>
    ${S.people.length > 1 ? field('Whose income?', `<select name="person">${peopleOptions(e.person || 'me')}</select>`) : ''}
    ${item ? (rec ? `<p class="small muted">↻ Repeats every month since ${esc(monthLabel(rec.startMonth))}.</p>` : '') : `<label class="check"><input type="checkbox" name="repeat" checked> Repeats every month</label>`}
    ${field('Note (optional)', `<input name="note" value="${esc(e.note || '')}">`)}`;
  const buttons = [];
  if (rec) {
    buttons.push({ label: 'Skip this month', onClick: () => { rec.skips = [...(rec.skips || []), ui.month]; closeModal(); save(); } });
    buttons.push({ label: 'Stop from this month', onClick: () => { if (rec.startMonth >= ui.month) S.recurring = S.recurring.filter(r => r !== rec); else rec.endMonth = addMonths(ui.month, -1); closeModal(); save(); } });
    buttons.push({ label: 'Delete', cls: 'danger', onClick: () => { if (confirm(`Delete “${rec.name}” from ALL months? (Use “Stop from this month” if it was correct before.)`)) { S.recurring = S.recurring.filter(r => r !== rec); closeModal(); save(); } } });
  } else if (ent) buttons.push({ label: 'Delete', cls: 'danger', onClick: () => { if (confirm(`Delete “${ent.name}”?`)) { S.entries = S.entries.filter(x => x !== ent); closeModal(); save(); } } });
  openModal(item ? 'Edit income' : 'Add income', body, fd => {
    const o = { kind: 'income', name: fd.get('name').trim(), amount: num(fd.get('amount')), person: fd.get('person') || ME, note: fd.get('note').trim() };
    const d = fd.get('date') || defaultDate();
    if (rec) Object.assign(rec, o, { day: +d.slice(8, 10) });
    else if (ent) Object.assign(ent, o, { date: d });
    else if (fd.get('repeat')) S.recurring.push({ id: uid(), ...o, day: +d.slice(8, 10), startMonth: d.slice(0, 7), endMonth: null, skips: [] });
    else S.entries.push({ id: uid(), ...o, date: d });
  }, buttons);
}

function goalForm(g) {
  const body = `${field('What are you saving for?', `<input name="name" required value="${esc(g?.name || '')}" placeholder="e.g. Summer trip, New laptop" autocomplete="off">`)}
    <div class="two">${field('Target amount', `<input name="target" required type="number" inputmode="decimal" min="0" step="0.01" value="${g?.target || ''}">`)}
    ${field('Reach it by (optional)', `<input name="deadline" type="month" value="${g?.deadline || ''}">`)}</div>
    ${g ? '' : field('Already saved (optional)', `<input name="initial" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00">`)}
    <p class="small muted">With a date, the app tells you how much to put aside each month.</p>`;
  openModal(g ? 'Edit goal' : 'New savings goal', body, fd => {
    const o = { name: fd.get('name').trim(), target: num(fd.get('target')), deadline: fd.get('deadline') || '' };
    if (g) Object.assign(g, o);
    else { const ng = { id: uid(), ...o, contributions: [] }; const ini = num(fd.get('initial')); if (ini) ng.contributions.push({ id: uid(), month: '0000-00', date: todayISO(), amount: ini, note: 'Starting balance' }); S.goals.push(ng); }
  }, g ? [{ label: 'Delete goal', cls: 'danger', onClick: () => { if (confirm(`Delete “${g.name}” and its history? Savings lines linked to it stay in your expenses.`)) { for (const x of [...S.entries, ...S.recurring]) if (x.goalId === g.id) { x.goalId = ''; x.category = 'Savings'; } S.goals = S.goals.filter(x => x !== g); closeModal(); save(); } } }] : []);
}
function contributeForm(g, sign) {
  const saved = goalSaved(g);
  openModal(sign > 0 ? `Add to “${g.name}”` : `Withdraw from “${g.name}”`,
    `${field('Amount', `<input name="amount" required type="number" inputmode="decimal" min="0" step="0.01" ${sign < 0 ? `max="${saved}"` : ''}>`)}
     ${S.people.length > 1 ? field(sign > 0 ? 'Whose money?' : 'Who gets it back?', `<select name="person">${peopleOptions(ME)}</select>`) : ''}
     <p class="small muted">${sign > 0 ? `Counts as saved in ${esc(monthLabel(ui.month))}. For a regular amount every month, use “↻ Save monthly” instead.` : `Currently saved: ${money(saved)}. Withdrawals go back into ${esc(monthLabel(ui.month))}'s budget.`}</p>`,
    fd => { const a = num(fd.get('amount')); if (!a) return false; g.contributions.push({ id: uid(), month: ui.month, person: fd.get('person') || ME, date: ui.month === curMonth() ? todayISO() : ui.month + '-01', amount: sign * a }); });
}
function historyView(g) {
  const list = [...(g.contributions || [])].sort((a, b) => b.date.localeCompare(a.date));
  const linked = linkedSaved(g);
  openModal(`${g.name} · history`, (linked ? `<p class="small">${money(linked)} came from savings lines in your expenses (edit those under Spending → Savings).</p>` : '') +
    (list.length ? `<ul class="list">${list.map(c => `<li class="row" data-act="del-contrib" data-g="${g.id}" data-id="${c.id}"><div class="main"><div class="title">${c.note ? esc(c.note) : c.amount > 0 ? 'Added' : 'Withdrawn'}${S.people.length > 1 && c.person ? ' · ' + esc(pname(c.person)) : ''}</div><div class="sub">${c.month === '0000-00' ? 'before tracking' : esc(monthLabel(c.month))} · tap to delete</div></div><div class="amt num ${c.amount < 0 ? 'neg' : 'pos'}">${c.amount > 0 ? '+' : ''}${money(c.amount)}</div></li>`).join('')}</ul>` : '<p class="muted">No one-off contributions yet.</p>'), () => {});
}
function savingForm(g) {
  expenseForm(null, { name: g ? 'Savings – ' + g.name : 'Savings', category: 'Savings', goalId: g ? g.id : '', fixed: true, repeat: true });
}
function personForm(p) {
  const used = p && (S.entries.some(e => e.paidBy === p.id || e.person === p.id || (e.split || {})[p.id]) || S.recurring.some(e => e.paidBy === p.id || e.person === p.id || (e.split || {})[p.id]) || S.settlements.some(s => s.from === p.id || s.to === p.id));
  openModal(p ? 'Edit person' : 'Add person', `${field('Name', `<input name="name" required value="${esc(p?.name || '')}" placeholder="e.g. Sara, Roommate" autocomplete="off">`)}
    ${p && p.id !== 'me' && used ? '<p class="small muted">This person is used in expenses, so they can’t be removed (that would break the history).</p>' : ''}`,
    fd => { const name = fd.get('name').trim(); if (p) p.name = name; else S.people.push({ id: uid(), name, color: COLORS[S.people.length % COLORS.length] }); },
    p && p.id !== 'me' && !used ? [{ label: 'Remove', cls: 'danger', onClick: () => { S.people = S.people.filter(x => x !== p); closeModal(); save(); } }] : []);
}
function settleForm(pid) {
  const v = balances()[pid] || 0;
  const from = v < 0 ? pid : ME, to = v < 0 ? ME : pid;
  openModal('Settle up', `<div class="two">${field('From', `<select name="from">${peopleOptions(from)}</select>`)}${field('To', `<select name="to">${peopleOptions(to)}</select>`)}</div>
    <div class="two">${field('Amount', `<input name="amount" required type="number" inputmode="decimal" min="0" step="0.01" value="${Math.abs(v).toFixed(2)}">`)}${field('Date', `<input name="date" type="date" value="${todayISO()}">`)}</div>
    <p class="small muted">Records a payment between people. It doesn't change your spending, only who owes whom.</p>`,
    fd => { if (fd.get('from') === fd.get('to')) return false; S.settlements.push({ id: uid(), from: fd.get('from'), to: fd.get('to'), amount: num(fd.get('amount')), date: fd.get('date') || todayISO() }); });
}

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const tabBtn = ev.target.closest('nav.tabs button');
  if (tabBtn) { ui.tab = tabBtn.dataset.tab; render(); scrollTo(0, 0); return; }
  const a = ev.target.closest('[data-act]'); if (!a) return;
  const id = a.dataset.id;
  if (a.tagName === 'A') ev.preventDefault();
  switch (a.dataset.act) {
    case 'prev-month': ui.month = addMonths(ui.month, -1); render(); break;
    case 'next-month': ui.month = addMonths(ui.month, 1); render(); break;
    case 'today': ui.month = curMonth(); render(); break;
    case 'goto': ui.month = a.dataset.m; render(); break;
    case 'tab': ui.tab = a.dataset.tab; render(); break;
    case 'view': ui.view = a.dataset.v; render(); break;
    case 'filter': ui.filter = a.dataset.f; render(); break;
    case 'fab': ({ overview: () => expenseForm(), spending: () => ui.filter === 'savings' ? savingForm() : expenseForm(null, ui.filter === 'fixed' ? { fixed: true, category: 'Housing' } : {}), income: () => incomeForm(), goals: () => goalForm(), people: () => personForm() })[ui.tab]?.(); break;
    case 'add-expense': expenseForm(null, a.dataset.fixed ? { fixed: true, category: 'Housing' } : {}); break;
    case 'add-saving': savingForm(); break;
    case 'goal-monthly': savingForm(S.goals.find(g => g.id === id)); break;
    case 'add-income': incomeForm(); break;
    case 'edit': { const it = itemsFor(ui.month).find(x => x.id === id && x.src === a.dataset.src); if (it) (it.kind === 'income' ? incomeForm : expenseForm)(it); break; }
    case 'contribute': contributeForm(S.goals.find(g => g.id === id), 1); break;
    case 'withdraw': contributeForm(S.goals.find(g => g.id === id), -1); break;
    case 'history': historyView(S.goals.find(g => g.id === id)); break;
    case 'edit-goal': goalForm(S.goals.find(g => g.id === id)); break;
    case 'del-contrib': { const g = S.goals.find(x => x.id === a.dataset.g); if (g && confirm('Delete this entry?')) { g.contributions = g.contributions.filter(c => c.id !== id); closeModal(); save(); } break; }
    case 'edit-person': personForm(S.people.find(p => p.id === id)); break;
    case 'settle': settleForm(id); break;
    case 'del-settle': if (confirm('Delete this settlement?')) { S.settlements = S.settlements.filter(s => s.id !== id); save(); } break;
    case 'add-cat': S.categories.push({ name: 'New category', limit: 0 }); save(); break;
    case 'del-cat': { const c = S.categories[+a.dataset.i]; if (confirm(`Remove category “${c.name}”? Existing expenses keep their label.`)) { S.categories.splice(+a.dataset.i, 1); save(); } break; }
    case 'export': download(`budget-backup-${todayISO()}.json`, JSON.stringify(S, null, 2), 'application/json'); break;
    case 'csv': exportCSV(); break;
    case 'import': $('#importFile').click(); break;
    case 'pin': sync.pin = ''; pull(); break;
    case 'link': {
      const url = $('#syncUrl').value.trim(), key = $('#syncKey').value.trim();
      if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) { alert('That doesn’t look like a Google Apps Script web app URL (it should start with https://script.google.com/macros/s/ and end with /exec).'); break; }
      if (!key) { alert('Enter the sync password (SECRET) you set in the script.'); break; }
      sync.cfg = { url, key }; lsSet('budget-sync', JSON.stringify(sync.cfg)); sync.status = 'offline'; render(); syncNow(); break;
    }
    case 'unlink': if (confirm('Stop syncing this phone? Your data stays on this phone.')) { sync.cfg = null; lsSet('budget-sync', null); sync.status = 'local'; serverAbsent = false; render(); syncNow(); } break;
    case 'sync-now': syncNow(); break;
    case 'paste-link': { const cfg = parseSetup($('#syncPaste').value); if (!cfg) { alert('That isn’t a valid setup link. On the other phone use Settings → “Copy link for the other phone” and paste the whole link.'); break; } applySetup(cfg); render(); syncNow(); break; }
    case 'copy-link': { const l = setupLink(); (navigator.clipboard ? navigator.clipboard.writeText(l) : Promise.reject()).then(() => alert('Link copied. Send it to the other phone and open it there.'), () => prompt('Copy this link and open it on the other phone:', l)); break; }
    case 'reset': if (confirm('Erase ALL budget data on this device' + (sync.on ? ' and the server' : '') + '? Export a backup first if unsure.') && confirm('Really erase everything?')) { const old = recKeys(S); S = defaultState(); S.deleted = {}; for (const k of old.keys()) if (k !== 'meta' && k !== 'people:me') S.deleted[k.slice(k.indexOf(':') + 1)] = Date.now(); snap = recKeys(S); save(); } break;
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'setCurrency') { S.settings.currency = t.value; save(); }
  else if (t.id === 'setLocale') { S.settings.locale = t.value; save(); }
  else if (t.id === 'setMe') { ME = t.value; lsSet('budget-me', ME); ui.justLinked = false; render(); }
  else if (t.dataset.cat != null) {
    const c = S.categories[+t.dataset.cat];
    if (t.dataset.k === 'limit') c.limit = num(t.value);
    else { const nn = t.value.trim(); if (!nn) return render(); for (const e of [...S.entries, ...S.recurring]) if (e.category === c.name) e.category = nn; c.name = nn; }
    save();
  } else if (t.id === 'importFile' && t.files[0]) {
    t.files[0].text().then(txt => {
      try { const d = JSON.parse(txt); if (!d || !Array.isArray(d.entries)) throw 0; if (confirm('Replace all current data with this backup?')) { const old = S; S = migrate(d); for (const k of recKeys(old).keys()) if (k !== 'meta' && !recKeys(S).has(k)) S.deleted[k.slice(k.indexOf(':') + 1)] = Date.now(); snap = new Map(); save(); } }
      catch { alert('That file is not a valid budget backup.'); }
      t.value = '';
    });
  }
});
function download(name, text, type) { const u = URL.createObjectURL(new Blob([text], { type })); const l = Object.assign(document.createElement('a'), { href: u, download: name }); document.body.append(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000); }
function exportCSV() {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [['Date', 'Type', 'Name', 'Category', 'Fixed/Variable', 'Joint', 'Paid by', 'Split mode', 'Split', 'Amount', 'My share', 'Recurring', 'Note']];
  for (const e of itemsFor(ui.month)) rows.push([e.date, e.kind, e.name, e.category || '', e.kind === 'expense' ? (isSavings(e) ? 'Savings' : e.fixed ? 'Fixed' : 'Variable') : '', isJoint(e) ? 'Joint' : 'Personal', e.kind === 'expense' ? person(e.paidBy).name : person(e.person || 'me').name, isJoint(e) ? splitModeOf(e) : '', e.kind === 'expense' ? splitIds(e).map(i => `${person(i).name}:${e.split[i]}`).join(' ') : '', e.amount.toFixed(2), (e.kind === 'expense' ? shareOf(e, ME) : ((e.person || 'me') === ME ? e.amount : 0)).toFixed(2), e.src === 'recurring' ? 'yes' : '', e.note || '']);
  download(`budget-${ui.month}.csv`, rows.map(r => r.map(q).join(',')).join('\n'), 'text/csv');
}
// swipe left/right on the page to change month (phones)
let tx = null;
document.addEventListener('touchstart', e => { tx = $('#modal').open ? null : [e.touches[0].clientX, e.touches[0].clientY]; }, { passive: true });
document.addEventListener('touchend', e => { if (!tx || ev_in_scroller(e)) return; const dx = e.changedTouches[0].clientX - tx[0], dy = e.changedTouches[0].clientY - tx[1]; if (Math.abs(dx) > 80 && Math.abs(dy) < 40) { ui.month = addMonths(ui.month, dx < 0 ? 1 : -1); render(); } tx = null; }, { passive: true });
function ev_in_scroller(e) { return !!e.target.closest('.chips'); }

if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
readSetupLink();
render();
syncNow();
</script>
</body>
</html>
